name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "codex/**" ]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found on the runner."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      # Debug signing keys generated by GitHub-hosted runners are NOT persistent.
      # Never ship the CI preview under the real app ID: users must be able to
      # install it next to their existing application without uninstalling.
      - name: Set isolated preview package identity
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_SUFFIX="preview${GITHUB_SHA:0:12}"
          echo "PREVIEW_SUFFIX=$PREVIEW_SUFFIX" >> "$GITHUB_ENV"
          echo "PREVIEW_PACKAGE=com.arman.investmentandroid.$PREVIEW_SUFFIX" >> "$GITHUB_ENV"
          echo "PREVIEW_APK=InvestmentAndroid-0.32.0-$PREVIEW_SUFFIX.apk" >> "$GITHUB_ENV"

      - name: Test, lint and build isolated preview APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug "-PpreviewApplicationSuffix=$PREVIEW_SUFFIX" --stacktrace

      - name: Verify APK identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          # Fail if this would overwrite the real application installation.
          grep -Fq "name='$PREVIEW_PACKAGE'" <<< "$BADGING"
          grep -Fq "application-label:'Investment Preview'" <<< "$BADGING"
          grep -Fq "versionCode='32' versionName='0.32.0'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          mkdir -p dist
          cp "$APK" "dist/$PREVIEW_APK"
          (cd dist && sha256sum "$PREVIEW_APK" > SHA256SUMS.txt)
          printf 'Source commit: %s\nPreview package: %s\nIndependent app data: yes\n' \
            "$GITHUB_SHA" "$PREVIEW_PACKAGE" > dist/SOURCE-COMMIT.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InvestmentAndroid-0.32.0-isolated-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
