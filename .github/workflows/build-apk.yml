name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "codex/**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found on the runner."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Test, lint and build debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify APK identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          grep -q "name='com.arman.investmentandroid'" <<< "$BADGING"
          grep -q "versionCode='32' versionName='0.32.0'" <<< "$BADGING"
          mkdir -p dist
          cp "$APK" dist/InvestmentAndroid-0.32.0-debug.apk
          sha256sum dist/InvestmentAndroid-0.32.0-debug.apk > dist/SHA256SUMS.txt
          printf 'Source commit: %s\n' "$GITHUB_SHA" > dist/SOURCE-COMMIT.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InvestmentAndroid-0.32.0-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
